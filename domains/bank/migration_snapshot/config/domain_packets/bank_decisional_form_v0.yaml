# domain_packets/bank_decisional_form_v0.yaml
# P3-07 — V3.2.2 COMPLETION
# Formulaire décisionnel du domaine BANK.
# Définit le contrat entre le domaine Bank et le Kernel X-108.
# STATUT : REVIEW_REQUIRED — à valider par l'opérateur avant activation.

domain: "bank"
version: "v0"
integration_phase: "P3"
kernel_endpoint: "http://127.0.0.1:3001/kernel/ragnarok"
gate_file: "domains/bank/bank_x108_gate.py"

metadata:
  description: "Gouvernance des opérations bancaires via Kernel X-108"
  domain_type: "FINANCIAL_SERVICES"
  regulation: ["BÂLE_III", "LCB_FT", "MIFID_II", "PSD2"]
  created_by: "V3_2_2_COMPLETION"

entities:
  - "Account"
  - "Transaction"
  - "Payment"
  - "Customer"
  - "Counterparty"
  - "Product"

risk_classes:
  - "FINANCIAL_FRAUD"
  - "ANTI_MONEY_LAUNDERING"
  - "LIMIT_VIOLATION"
  - "REGULATORY_SANCTION"
  - "AUDIT_QUALITY"
  - "DATA_QUALITY"

flow_types:
  - "PAYMENT"
  - "TRANSFER"
  - "WITHDRAWAL"
  - "DEPOSIT"
  - "BALANCE_CHECK"
  - "STATEMENT"
  - "FRAUD_ALERT"
  - "COMPLIANCE_SCAN"

ir_mapping:
  t_mean_source_field: "risk_score"
  h_score_source_field: "confidence_index"
  a_score_source_field: "audit_score"
  default_threshold_s: 0.6

gate:
  class: "BankX108Gate"
  calls_kernel: true
  decides_alone: false
  fail_closed: true
  default_verdict_on_error: "HOLD"

sigma_agent:
  planned: true
  file: "sigma/domains/bank_domain_agent.py"
  emits_verdict: false

nuisances:
  file: "domains/bank/nuisance_registry.py"
  count: 6

kernel_rule:
  decision_authority: KX108_ONLY
  kernel_mutation: false
  fail_closed: true
  mur_de_beton: true
