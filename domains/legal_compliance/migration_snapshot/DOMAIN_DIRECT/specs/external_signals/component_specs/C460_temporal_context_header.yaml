- time_bounded_tool_call_score
formulas:
- Header = (tick_index, phase_window, nonce, expires_at_tick, signature_status)
invariants:
- header_does_not_authorize
- expired_header_blocks_candidate
- KX108_ONLY
- DECISION_AUTHORITY = KX108_ONLY
- no_external_signal_emits_ACT
- no_external_signal_mutates_kernel
- proof_before_consequence
