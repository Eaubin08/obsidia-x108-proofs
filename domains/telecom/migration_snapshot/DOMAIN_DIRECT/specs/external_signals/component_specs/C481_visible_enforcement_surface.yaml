id: C481
name: visible_enforcement_surface
family: external_consequence_boundary
type: rssi_surface
source: external_category_signal
status: spec_patch_ready
definition: RSSI-visible proof surface exposing decision boundary, receipts, replay,
  refused consequences and authority without exposing or reauthoring kernel internals.
role: RSSI audit enrichment / proof-surface extension; never a decision authority.
internal_components:
- decision_summary
- authority_applied
- intent_receipt
- effect_receipt
- replay_pointer
- protected_consequence
- standing_status
inputs:
- audit_packet
- rssi_review_request
outputs:
- visible_enforcement_surface_report
metrics:
- definition_completeness
- input_output_clarity
- integration_clarity
- runtime_readiness
- proof_readiness
- testability_score
- observability_score
- replayability_score
- drift_risk
- authority_risk
- kernel_boundary_safety
- irreversibility_exposure
- world_action_proximity
- authority_boundary_clarity
- evidence_surface_completeness
- replay_integrity
- custody_integrity
- rssi_readability
- audit_exportability
- non_reauthoring_score
- standing_validity_score
- continuation_legitimacy_score
- consequence_binding_clarity
- intent_effect_separation_score
- protected_consequence_clarity
- corridor_scope_clarity
- refusal_preservation_score
- law_state_input_replay_score
formulas:
- surface_completeness = visible_receipts ∧ visible_replay ∧ visible_authority ∧ visible_refusal
invariants:
- visible_surface_does_not_decide
- wrapper_non_reauthoring_law
- KX108_ONLY
- DECISION_AUTHORITY = KX108_ONLY
- no_external_signal_emits_ACT
- no_external_signal_mutates_kernel
- proof_before_consequence
tests:
- test_visible_surface_no_ACT
- test_surface_contains_receipts
proof_artifacts:
- intent_receipt
- effect_receipt_only_after_ACT
- replay_pointer
- hash_chain_packet
- rssi_audit_report
runtime_status: spec_only
authority: advisory_external_signal
kx108_boundary:
  decision_authority: KX108_ONLY
  can_emit_ACT: false
  can_emit_HOLD: false
  can_emit_BLOCK: false
  can_emit_world_action: false
  can_emit_kernel_mutation: false
  can_emit_action_candidate: true
  requires_kx108_if_action: true
  proof_required_if_action: true
  external_signal_only: true
  copied_from_external_runtime: false
  allowed_role: enrich proof/context only
  forbidden_role: decision authority
risks:
- category_drift
- external_concept_overreach
- wrapper_reauthoring_attempt
- decision_authority_confusion
dependencies:
- KX108_boundary_adapter
- world_action_gateway_guard
- OS3_evidence_packet
- visible_proof_surface
implementation_notes: Integrate as RSSI proof/context enrichment only. Do not copy
  external runtime or grant authority.
