metrics:
- name: authority_boundary_clarity
  definition: RSSI/external-signal metric for authority boundary clarity.
  range: 0..1
  formula: authority_boundary_clarity = evaluate(component_evidence, boundary_state,
    proof_artifacts)
  thresholds:
    target: 0.8
    minimum: 0.6
  interpretation: Higher is better except risk-oriented metrics, where the value must
    be interpreted by its specific test case.
  applies_to:
  - external_timeverse
  - external_consequence_boundary
  - RSSI proof surface
