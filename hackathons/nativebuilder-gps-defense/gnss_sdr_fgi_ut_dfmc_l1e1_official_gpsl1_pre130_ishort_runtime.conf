Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=/work/hackathons/nativebuilder-gps-defense/rf_attack_benchmark/gnss_sdr_runs/fgi_ut_dfmc_l1e1_pre130_ishort/observables.dat

