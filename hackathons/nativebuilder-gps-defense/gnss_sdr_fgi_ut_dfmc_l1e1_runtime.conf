; GNSS-SDR runtime configuration for FGI-SpoofRepo UT_DFMC L1/E1.
; Source metadata: real 8-bit I samples, fs=26 MHz, RF front-end center=1569.03 MHz.
; GPS L1 / Galileo E1 center is 1575.42 MHz, so IF is 6.39 MHz.

[GNSS-SDR]

GNSS-SDR.internal_fs_sps=4000000

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/work/hackathons/nativebuilder-gps-defense/data/fgi-spoofrepo/pipeline_inputs/case_0001_l1e1_real8.dat
SignalSource.item_type=byte
SignalSource.sampling_frequency=26000000
; First pass: 120 seconds. Increase to 0 for full 370 s campaign after receiver sanity passes.
SignalSource.samples=3120000000
SignalSource.repeat=false
SignalSource.dump=false
SignalSource.enable_throttle_control=false

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner

DataTypeAdapter.implementation=Ibyte_To_Complex

InputFilter.implementation=Freq_Xlating_Fir_Filter
InputFilter.item_type=gr_complex
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=11
InputFilter.number_of_bands=2
InputFilter.band1_begin=0.0
InputFilter.band1_end=0.70
InputFilter.band2_begin=0.85
InputFilter.band2_end=1.0
InputFilter.ampl1_begin=1.0
InputFilter.ampl1_end=1.0
InputFilter.ampl2_begin=0.0
InputFilter.ampl2_end=0.0
InputFilter.band1_error=1.0
InputFilter.band2_error=1.0
InputFilter.filter_type=bandpass
InputFilter.grid_density=16
InputFilter.sampling_frequency=26000000
InputFilter.IF=6390000
InputFilter.dump=false
InputFilter.dump_filename=/work/hackathons/nativebuilder-gps-defense/rf_attack_benchmark/gnss_sdr_runs/fgi_ut_dfmc_l1e1/input_filter.dat

Resampler.implementation=Direct_Resampler
Resampler.sample_freq_in=26000000
Resampler.sample_freq_out=4000000
Resampler.item_type=gr_complex
Resampler.dump=false
Resampler.dump_filename=/work/hackathons/nativebuilder-gps-defense/rf_attack_benchmark/gnss_sdr_runs/fgi_ut_dfmc_l1e1/resampler.dat

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=10
Channels.in_acquisition=2
Channel.signal=1C

;######### ACQUISITION GPS L1 C/A ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=10000
Acquisition_1C.doppler_step=250
Acquisition_1C.blocking=false
Acquisition_1C.dump=true
Acquisition_1C.dump_filename=/work/hackathons/nativebuilder-gps-defense/rf_attack_benchmark/gnss_sdr_runs/fgi_ut_dfmc_l1e1/acq_dump.dat

;######### TRACKING GPS L1 C/A ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=40.0
Tracking_1C.dll_bw_hz=4.0
Tracking_1C.order=3
Tracking_1C.dump=true
Tracking_1C.dump_filename=/work/hackathons/nativebuilder-gps-defense/rf_attack_benchmark/gnss_sdr_runs/fgi_ut_dfmc_l1e1/epl_tracking_ch_

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=/work/hackathons/nativebuilder-gps-defense/rf_attack_benchmark/gnss_sdr_runs/fgi_ut_dfmc_l1e1/observables.dat

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.elevation_mask=10
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false
PVT.dump=true
PVT.dump_filename=/work/hackathons/nativebuilder-gps-defense/rf_attack_benchmark/gnss_sdr_runs/fgi_ut_dfmc_l1e1/PVT
PVT.nmea_dump_filename=/work/hackathons/nativebuilder-gps-defense/rf_attack_benchmark/gnss_sdr_runs/fgi_ut_dfmc_l1e1/gnss_sdr_pvt.nmea
