updates:
  # Mise à jour automatique GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "obsidia-kernel-team"
    labels:
      - "dependencies"
      - "security"

