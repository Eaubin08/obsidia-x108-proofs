name: v01-c21-connector-entry-revocation-v0
on:
  push:
    branches: [feat/v01-c21-connector-identity-delegation-revocation-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c21-deny-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: C2.1 plus original C2 regression
        run: python -m pytest -q tests/integration/test_v01_c21_connector_entry_revocation_guard_v0.py tests/integration/test_v01_c2_organization_stack_lifecycle_v0.py
