name: v01-c223-offline-reservation-ledger
on:
  push:
    branches: [feat/v01-c223-offline-atomic-reservation-ledger-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest cryptography
      - run: python -m pytest -q tests/integration/test_v01_c223_offline_reservation_ledger_v0.py tests/integration/test_v01_c222_dispatch_fence_gap_v0.py tests/integration/test_v01_c221_revocation_concurrency_v0.py
