name: c245-ipc-ambiguous-recovery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest cryptography
      - run: python -m pytest -q tests/integration/test_v01_c245_ipc_ambiguous_commit_recovery_v0.py tests/integration/test_v01_c244_storage_worker_ipc_v0.py
