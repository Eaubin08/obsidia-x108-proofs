name: c238-atomic-guarded-write
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest cryptography
      - run: python -m pytest -q tests/integration/test_v01_c238_atomic_guarded_write_v0.py tests/integration/test_v01_c236_guarded_reservation_entrypoint_v0.py tests/integration/test_v01_c237_transaction_guard_snapshot_v0.py
