name: v01-c42-offline-interrepo-contract-harness-v0
on:
  push:
    branches: [feat/v01-c42-offline-interrepo-conformance-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-harness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Validate fail-closed local harness and existing C4/C3/C2/C1 contracts
        run: >-
          python -m pytest
          tests/integration/test_v01_c42_local_crossrepo_harness_v0.py
          tests/integration/test_v01_c41_crossrepo_contract_freeze_v0.py
          tests/integration/test_v01_c4_sector_evidence_conformance_v0.py
          tests/integration/test_v01_c3_multiorg_multidomain_sandbox_e2e_v0.py
          tests/integration/test_v01_c2_organization_stack_lifecycle_v0.py
          tests/integration/test_v01_c0_c1_company_model_v0.py
          -q
