name: c241-unified-canonical-guard-races
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest cryptography
      - run: python -m pytest -q tests/integration/test_v01_c241_unified_canonical_guards_v0.py tests/integration/test_v01_c240_canonical_trigger_check_v0.py tests/integration/test_v01_c237_transaction_guard_snapshot_v0.py tests/integration/test_v01_c235_unified_sqlite_guards_v0.py
