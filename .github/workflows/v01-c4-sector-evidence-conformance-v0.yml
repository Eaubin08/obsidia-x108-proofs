name: v01-c4-sector-evidence-conformance-v0
on:
  push:
    branches:
      - feat/v01-c4-sector-evidence-conformance-v0
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sector-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: C4 truth limits and existing C3/C2/C1 universal regression
        run: >-
          python -m pytest
          tests/integration/test_v01_c4_sector_evidence_conformance_v0.py
          tests/integration/test_v01_c3_multiorg_multidomain_sandbox_e2e_v0.py
          tests/integration/test_v01_c2_organization_stack_lifecycle_v0.py
          tests/integration/test_v01_c0_c1_company_model_v0.py
          tests/integration/test_obsidia_universal_cross_domain_conformance_v0.py
          tests/integration/test_universal_enterprise_stack_adapter_v0.py
          -q
