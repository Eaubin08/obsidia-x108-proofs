name: source-runtime-native-v0

on:
  push:
    branches:
      - feat/source-runtime-native-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Run source runtime + native ops + world action regression
        run: >-
          python -m pytest
          tests/integration/test_source_runtime_native_v0.py
          tests/integration/test_native_tasks_crm_v0.py
          tests/integration/test_world_action_pre_execution_v0.py
          tests/integration/test_world_action_live_gateway_v0.py
          tests/integration/test_world_action_bounded_executor_v0.py
          tests/integration/test_world_action_multidomain_conformance_v0.py
          -q
