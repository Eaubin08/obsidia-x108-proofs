name: source-interpretation-native-v0

on:
  push:
    branches:
      - feat/source-interpretation-native-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-interpretation-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Run source interpretation and prior source stack regression
        run: >-
          python -m pytest
          tests/integration/test_source_interpretation_native_v0.py
          tests/integration/test_enterprise_source_sandbox_v0.py
          tests/integration/test_native_source_connectors_v0.py
          tests/integration/test_source_runtime_native_v0.py
          tests/integration/test_native_tasks_crm_v0.py
          tests/integration/test_world_action_pre_execution_v0.py
          -q
