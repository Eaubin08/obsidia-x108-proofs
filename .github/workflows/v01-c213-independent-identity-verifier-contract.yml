name: v01-c213-independent-identity-verifier-contract
on:
  push:
    branches: [feat/v01-c213-independent-identity-verifier-adapter-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-verifier-fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/integration/test_v01_c213_independent_identity_verifier_contract_v0.py tests/integration/test_v01_c212_organization_authority_boundary_v0.py tests/integration/test_v01_c211_fixture_trust_chain_v0.py
