name: world-action-calendar-real-provider-pilot-v0

on:
  push:
    branches:
      - feat/world-action-calendar-real-provider-pilot-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-real-provider-pilot-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pytest

      - name: Run calendar provider-pilot evidence and universal regression
        run: >-
          python -m pytest
          tests/integration/test_world_action_calendar_real_provider_pilot_v0.py
          tests/integration/test_world_action_multidomain_conformance_v0.py
          tests/integration/test_world_action_bounded_executor_v0.py
          tests/integration/test_world_action_live_gateway_v0.py
          tests/integration/test_world_action_pre_execution_v0.py
          -q
