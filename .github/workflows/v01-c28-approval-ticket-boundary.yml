name: v01-c28-approval-ticket-boundary
on:
  push:
    branches: [feat/v01-c28-approval-ticket-boundary-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/integration/test_v01_c28_approval_ticket_boundary_v0.py tests/integration/test_v01_c27_world_action_kx108_record_boundary_v0.py tests/integration/test_v01_c26_sovereign_proof_boundary_audit_v0.py
