name: c222-revocation-dispatch-gap
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest cryptography
      - run: python -m pytest -q tests/integration/test_v01_c222_dispatch_fence_gap_v0.py tests/integration/test_v01_c221_revocation_concurrency_v0.py tests/integration/test_v01_c220_nonce_safe_canonical_preflight_v0.py
