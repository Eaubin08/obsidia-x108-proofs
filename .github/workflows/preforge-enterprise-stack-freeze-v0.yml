name: preforge-enterprise-stack-freeze-v0

on:
  push:
    branches:
      - feat/preforge-enterprise-stack-freeze-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preforge-enterprise-stack-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Run pre-Forge enterprise stack regression
        run: >-
          python -m pytest
          tests/integration/test_preforge_enterprise_stack_freeze_v0.py
          tests/integration/test_autonomous_office_e2e_v0.py
          tests/integration/test_enterprise_source_sandbox_v0.py
          tests/integration/test_native_source_connectors_v0.py
          tests/integration/test_source_runtime_native_v0.py
          tests/integration/test_native_tasks_crm_v0.py
          tests/integration/test_world_action_pre_execution_v0.py
          tests/integration/test_world_action_live_gateway_v0.py
          tests/integration/test_world_action_bounded_executor_v0.py
          tests/integration/test_world_action_multidomain_conformance_v0.py
          tests/integration/test_google_calendar_connector_adapter_v0.py
          tests/integration/test_google_calendar_governed_real_pilot_v0.py
          tests/integration/test_gmail_draft_connector_adapter_v0.py
          tests/integration/test_gmail_draft_governed_real_pilot_v0.py
          -q
