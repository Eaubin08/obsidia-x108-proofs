name: c221-sqlite-concurrency
on:
  push:
    branches: [feat/v01-c221-sqlite-revocation-concurrency-audit-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest cryptography
      - run: python -m pytest -q tests/integration/test_v01_c221_revocation_concurrency_v0.py tests/integration/test_v01_c220_nonce_safe_canonical_preflight_v0.py tests/integration/test_v01_c219_delegation_kx108_ticket_preflight_v0.py
