name: v01-c27-world-action-kx108-record-boundary
on:
  push:
    branches: [feat/v01-c27-world-action-kx108-record-verification-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sovereign-record-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/integration/test_v01_c27_world_action_kx108_record_boundary_v0.py tests/integration/test_v01_c26_sovereign_proof_boundary_audit_v0.py tests/integration/test_v01_c24_gateway_dryrun_composition_v0.py
