name: v01-c25-hold-preflight
on:
  push:
    branches: [feat/v01-c25-gateway-hold-preflight-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/integration/test_v01_c24_gateway_dryrun_composition_v0.py tests/integration/test_v01_c23_durable_revocation_ledger_v0.py tests/integration/test_v01_c22_scoped_delegation_proof_v0.py tests/integration/test_v01_c21_connector_entry_revocation_guard_v0.py
