name: Verify proofs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Check Lean toolchain
        run: |
          cd proofs/lean
          lake --version
          lean --version

      - name: Build Lean proofs
        run: |
          cd proofs/lean
          lake build

  verify-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Sigma tests
        run: |
          python -m pytest sigma/tests -v

      - name: Run public verifiers
        run: |
          python proofs/verify_all.py || true

  verify-tla-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: TLA placeholder
        run: |
          echo "TLC workflow placeholder"
          ls proofs/tla

