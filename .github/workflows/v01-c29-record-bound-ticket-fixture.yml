name: v01-c29-record-bound-ticket-fixture
on:
  push:
    branches: [feat/v01-c29-record-bound-ticket-attestation-fixture-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ticket-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/integration/test_v01_c29_record_bound_ticket_fixture_v0.py tests/integration/test_v01_c28_approval_ticket_boundary_v0.py tests/integration/test_v01_c27_world_action_kx108_record_boundary_v0.py
