name: v01-c2-organization-stack-lifecycle-v0
on:
  push:
    branches:
      - feat/v01-c2-organization-stack-lifecycle-v0
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c2-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: C2 scope, source onboarding, provider change, tenant isolation
        run: >-
          python -m pytest
          tests/integration/test_v01_c2_organization_stack_lifecycle_v0.py
          tests/integration/test_v01_c0_c1_company_model_v0.py
          tests/integration/test_universal_enterprise_stack_adapter_v0.py
          tests/integration/test_obsidia_universal_cross_domain_conformance_v0.py
          tests/integration/test_source_runtime_native_v0.py
          -q
