name: c220-canonical-nonce
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest cryptography
      - run: python -m pytest -q tests/integration/test_v01_c220_nonce_safe_canonical_preflight_v0.py tests/integration/test_v01_c219_delegation_kx108_ticket_preflight_v0.py
