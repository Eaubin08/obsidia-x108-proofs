name: Verify proofs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Force Node 24 pour supprimer les avertissements d'obsolescence
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ---------------------------------------------------------------
  # JOB STRICT (BLOQUANT) : vérificateurs Python purs
  # Pas de dépendance externe (pas de TSA, pas de Java, pas de Lean)
  # Ce job DOIT passer. Un échec ici est une vraie régression.
  # ---------------------------------------------------------------
  verify-python-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip pytest cryptography pyopenssl requests
      - name: Lancer verify_all.py (BLOQUANT)
        run: |
          set +e
          python proofs/verify_all.py
          code=$?
          echo "VERIFY_ALL_EXIT=$code"
          if [ -f "proofs/PROOFKIT_REPORT.json" ]; then
            echo "===== PROOFKIT_REPORT.json ====="
            cat proofs/PROOFKIT_REPORT.json
          else
            echo "PROOFKIT_REPORT.json absent"
          fi
          exit $code
      - name: Lancer verify_decision.py (BLOQUANT)
        run: |
          python proofs/verify_decision.py
      - name: Lancer aggregation_stable.py (BLOQUANT)
        run: |
          if [ -f "RECUPE_SCORING/aggregation_stable.py" ]; then
            python RECUPE_SCORING/aggregation_stable.py
          else
            echo "INFO: RECUPE_SCORING/aggregation_stable.py non trouvé, étape sautée."
          fi

  # ---------------------------------------------------------------
  # JOB NON BLOQUANT : preuves Lean (dépendance elan/Lake)
  # continue-on-error: true car installation Lean peut échouer en CI
  # ---------------------------------------------------------------
  verify-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Installer elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Compiler les preuves Lean
        continue-on-error: true
        run: |
          if [ -d "proofs/lean" ]; then
            cd proofs/lean
            lake build
          else
            echo "INFO: Dossier proofs/lean non trouvé, build sauté."
          fi

  # ---------------------------------------------------------------
  # JOB NON BLOQUANT : Sigma tests + RFC3161 (dépendances réseau)
  # continue-on-error: true sur Sigma et RFC3161 car TSA = tiers
  # ---------------------------------------------------------------
  verify-sigma-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip pytest cryptography pyopenssl requests
      - name: Lancer les tests Sigma
        continue-on-error: true
        run: |
          if [ -d "sigma/tests" ]; then
            python -m pytest sigma/tests -v
          else
            echo "INFO: Dossier sigma/tests non trouvé."
          fi
      - name: Vérifier le schéma d'ancre RFC3161
        continue-on-error: true
        run: |
          if [ -f "qa/cross-platform/test_rfc3161_anchor_schema.py" ]; then
            python -m pytest qa/cross-platform/test_rfc3161_anchor_schema.py -v
          else
            echo "INFO: Test RFC3161 anchor schema non trouvé."
          fi
      - name: QA multi-plateforme RFC3161
        continue-on-error: true
        run: |
          if [ -f "qa/cross-platform/test_rfc3161_cross_platform.py" ]; then
            python -m pytest qa/cross-platform/test_rfc3161_cross_platform.py -v
          else
            echo "INFO: Test RFC3161 cross-platform non trouvé."
          fi

  # ---------------------------------------------------------------
  # JOB NON BLOQUANT : model-checking TLC (dépendance Java + jar)
  # continue-on-error: true car téléchargement du jar peut échouer
  # ---------------------------------------------------------------
  verify-tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configurer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Télécharger TLC
        run: curl -L https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar -o tla2tools.jar
      - name: Lancer TLC sur X108_MC
        continue-on-error: true
        run: |
          if [ -f "formal/tla/X108_MC.tla" ]; then
            java -jar tla2tools.jar -config formal/tla/X108_MC.cfg formal/tla/X108_MC.tla
          else
            echo "INFO: Spécification TLA+ non trouvée."
          fi
