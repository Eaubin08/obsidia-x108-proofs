name: Verify proofs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-python-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest cryptography pyopenssl requests

      - name: Run verify_all.py blocking
        run: |
          set +e
          python proofs/verify_all.py
          code=$?
          echo "VERIFY_ALL_EXIT=$code"

          if [ -f "proofs/PROOFKIT_REPORT.json" ]; then
            echo "===== PROOFKIT_REPORT.json ====="
            cat proofs/PROOFKIT_REPORT.json
          else
            echo "PROOFKIT_REPORT.json absent"
          fi

          exit $code

      - name: Run verify_decision.py if canonical envelope exists
        run: |
          echo "=== verify_decision envelope discovery ==="
          ENVELOPE=""

          for candidate in \
            "proofs/decision_envelope.json" \
            "proofs/examples/decision_envelope.json" \
            "proofs/examples/valid_decision_envelope.json" \
            "proofs/V18_3_1/decision_envelope.json" \
            "examples/decision_envelope.json"
          do
            if [ -f "$candidate" ]; then
              ENVELOPE="$candidate"
              break
            fi
          done

          if [ -z "$ENVELOPE" ]; then
            echo "INFO: no canonical decision envelope found; verify_decision.py skipped."
            exit 0
          fi

          echo "Using envelope: $ENVELOPE"
          python proofs/verify_decision.py "$ENVELOPE"

      - name: Compile aggregation_stable.py if present
        run: |
          if [ -f "RECUPE_SCORING/aggregation_stable.py" ]; then
            python -m py_compile RECUPE_SCORING/aggregation_stable.py
          else
            echo "INFO: RECUPE_SCORING/aggregation_stable.py not found, skipped."
          fi

  verify-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build Lean proofs if present
        run: |
          if [ -d "proofs/lean" ]; then
            cd proofs/lean
            lake build
          else
            echo "INFO: proofs/lean not found, skipped."
          fi

  verify-sigma-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest cryptography pyopenssl requests

      - name: Run Sigma tests only if test files exist
        run: |
          if [ ! -d "sigma/tests" ]; then
            echo "INFO: sigma/tests not found, skipped."
            exit 0
          fi

          if ! find sigma/tests -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            echo "INFO: sigma/tests exists but has no pytest files, skipped."
            exit 0
          fi

          python -m pytest sigma/tests -v

      - name: Run RFC3161 anchor schema test only if present
        run: |
          TARGET="qa/cross-platform/test_rfc3161_anchor_schema.py"

          if [ ! -f "$TARGET" ]; then
            echo "INFO: RFC3161 anchor schema test not found, skipped."
            exit 0
          fi

          python -m pytest "$TARGET" -v

      - name: Run RFC3161 cross-platform test only if collectable
        run: |
          TARGET="qa/cross-platform/test_rfc3161_cross_platform.py"

          if [ ! -f "$TARGET" ]; then
            echo "INFO: RFC3161 cross-platform test not found, skipped."
            exit 0
          fi

          set +e
          python -m pytest --collect-only -q "$TARGET"
          collect_code=$?
          set -e

          if [ "$collect_code" -eq 5 ]; then
            echo "INFO: RFC3161 cross-platform file exists but has no collectable pytest tests, skipped."
            exit 0
          fi

          if [ "$collect_code" -ne 0 ]; then
            echo "FAIL: pytest collection failed with code $collect_code"
            exit "$collect_code"
          fi

          python -m pytest "$TARGET" -v

  verify-tla:
    runs-on: ubuntu-latest
    env:
      TLA_VERSION: "v1.7.4"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        id: cache-tla
        with:
          path: tla2tools.jar
          key: tla2tools-${{ env.TLA_VERSION }}

      - name: Download TLC
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          curl -fL \
            https://github.com/tlaplus/tlaplus/releases/download/${{ env.TLA_VERSION }}/tla2tools.jar \
            -o tla2tools.jar

      - name: Run TLC X108_MC if present
        run: |
          if [ -f "formal/tla/X108_MC.tla" ]; then
            java -jar tla2tools.jar -config formal/tla/X108_MC.cfg formal/tla/X108_MC.tla
          else
            echo "INFO: TLA specification not found, skipped."
          fi