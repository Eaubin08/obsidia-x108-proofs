name: X108 Periphery CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '_local_audits/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          python -m pip install pytest
      - name: Configure isolated Git identity for synthetic repository tests
        run: |
          git config --global user.name "Obsidia CI Tests"
          git config --global user.email "obsidia-ci-tests@users.noreply.github.com"
      - name: Install Lean toolchain for canonical conformance tests
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Python syntax check
        run: python -m compileall periphery -q
      - name: Generate manifest for tests
        run: python scripts/generate_recursive_manifest.py
      - name: Run all tests
        run: python scripts/run_nonrecursive_pytest.py -- tests/ -q --tb=short
      - name: Protected files check
        run: |
          git diff --exit-code -- sigma/guard.py sigma/contracts.py sigma/protocols.py sigma/aggregation.py proofs/lean/ formal/tla/ merkle_seal.json
      - name: Forbidden content check
        run: python scripts/check_forbidden_content.py
      - name: Refresh manifest after tests
        run: python scripts/generate_recursive_manifest.py
      - name: Verify manifest
        run: python scripts/verify_recursive_manifest.py
