name: v01-c23-durable-revocation-ledger
on:
  push:
    branches: [feat/v01-c23-durable-revocation-ledger-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-durable-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/integration/test_v01_c23_durable_revocation_ledger_v0.py tests/integration/test_v01_c22_scoped_delegation_proof_v0.py tests/integration/test_v01_c21_connector_entry_revocation_guard_v0.py tests/integration/test_v01_c2_organization_stack_lifecycle_v0.py
