# Reconciliation branch only. Same job as x108-periphery-ci.yml on main
# (48f0c2fb), without the Lean provisioning step added later by 765e3044,
# which fails before the test suite starts. The inherited workflow is unchanged.
name: Reconcile V1 full suite

on:
  push:
    branches: [ "reconcile/**" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          python -m pip install pytest
      - name: Python syntax check
        run: python -m compileall periphery -q
      - name: Generate manifest for tests
        run: python scripts/generate_recursive_manifest.py
      - name: Run all tests
        run: python scripts/run_nonrecursive_pytest.py -- tests/ -q --tb=short
      - name: Protected files check
        run: |
          git diff --exit-code -- sigma/guard.py sigma/contracts.py sigma/protocols.py sigma/aggregation.py proofs/lean/ formal/tla/ merkle_seal.json
      - name: Forbidden content check
        run: python scripts/check_forbidden_content.py
      - name: Refresh manifest after tests
        run: python scripts/generate_recursive_manifest.py
      - name: Verify manifest
        run: python scripts/verify_recursive_manifest.py
