name: world-action-live-gateway-v0

on:
  push:
    branches:
      - feat/world-action-live-gateway-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-action-live-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pytest

      - name: Run LIVE preflight and boundary regression
        run: >-
          python -m pytest
          tests/integration/test_world_action_live_gateway_v0.py
          tests/integration/test_world_action_pre_execution_v0.py
          tests/cli/kernel/test_kx108_runtime_link_facts_v1.py
          tests/periphery/test_gateway_dryrun_only.py
          tests/periphery/test_no_ticket_no_world_call.py
          tests/integration/test_v4_world_call_gateway_pipeline.py
          tests/integration/test_v4_sovereign_ticket_os3_pog_chain.py
          -q
