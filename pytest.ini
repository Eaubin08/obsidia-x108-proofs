; Canonical test perimeter for obsidia-x108-proofs.
;
; This file formalizes what the bare `python -m pytest -q` command means. It
; does NOT delete, repair or weaken anything: historical proofs, freezes and
; source packs stay exactly as they are on disk and remain runnable by
; pointing pytest at them explicitly.
;
; Three classes of tree exist in this repository:
;
;   CURRENT        tests/ (minus the legacy modules listed below) — the live
;                  perimeter that must stay green.
;   ARCHIVED_PROOF proofs/V18_3_1/, _FREEZE/, freeze/, _source_packs/,
;                  .runtime_freezes/ — sealed historical proof snapshots.
;                  They carry their own vendored trees and duplicate module
;                  basenames, so collecting them alongside CURRENT breaks
;                  collection. Never "repair" them to make a global run pass.
;   LEGACY         tests/ modules importing an `agents.*` layout that no
;                  longer exists (agents.obsidia_sigma_v130, agents.run_pipeline,
;                  agents.TradingState). Kept as history, excluded from the
;                  canonical run because they cannot import at all.

[pytest]
testpaths = tests

norecursedirs =
    .git
    .runtime_freezes
    _FREEZE
    _source_packs
    freeze
    proofs/V18_3_1
    node_modules
    __pycache__

; LEGACY modules — orphaned imports, excluded from the canonical perimeter.
addopts =
    --ignore=tests/sigma_stress_test.py
    --ignore=tests/test_agents_functional.py
    --ignore=tests/test_consensus_inprocess.py
    --ignore=tests/test_sigma_v18_9.py

markers =
    regression: full regression freeze checks (P80)
