<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsidia Runtime Wiring Preview — KX108_ONLY</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d2e; --border: #2d3148;
      --text: #e2e8f0; --muted: #64748b;
      --kernel: #7c3aed; --proof: #0ea5e9; --block: #ef4444;
      --green: #22c55e; --yellow: #eab308; --warn: #854d0e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13px; padding: 24px; min-height: 100vh;
    }
    h1 { color: var(--kernel); font-size: 14px; letter-spacing: .12em;
         text-transform: uppercase; margin-bottom: 4px; }
    .notice {
      border: 1px solid var(--warn); background: rgba(133,77,14,.15);
      color: #fbbf24; padding: 8px 12px; border-radius: 6px;
      margin: 12px 0; font-size: 12px;
    }
    .error {
      border: 1px solid var(--block); background: rgba(239,68,68,.1);
      color: #fca5a5; padding: 8px 12px; border-radius: 6px;
      margin: 12px 0; font-size: 12px; display: none;
    }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 640px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px;
    }
    .card-title {
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 0; border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .row:last-child { border-bottom: none; }
    .label { color: var(--muted); }
    .val-ok   { color: var(--green);  font-weight: bold; }
    .val-warn { color: var(--yellow); font-weight: bold; }
    .val-bad  { color: var(--block);  font-weight: bold; }
    .val-kernel { color: var(--kernel); font-weight: bold; }
    .val-proof  { color: var(--proof);  font-weight: bold; }
    #ts { margin-top: 16px; color: var(--muted); font-size: 11px; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 4px 10px; border-radius: 4px;
      cursor: pointer; font-size: 12px; font-family: inherit;
    }
    button:hover { border-color: var(--kernel); }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
    <h1>&#128737; Obsidia Runtime Wiring Preview</h1>
    <span style="margin-left:auto;color:var(--kernel);font-size:11px">KX108_ONLY</span>
    <button onclick="load()">&#8635; Refresh</button>
  </div>
  <div class="notice">
    &#128274; Preview read-only. No ACT. No runtime activation. Decision authority: KX108_ONLY.
  </div>
  <div class="error" id="err"></div>
  <div class="grid" id="grid" style="display:none"></div>
  <p id="ts"></p>

  <script>
    // API URL — defaults to engine on 8000; override via ?api=http://127.0.0.1:8013
    const params = new URLSearchParams(location.search)
    const API = (params.get('api') || 'http://127.0.0.1:8000').replace(/\/$/, '')
    const PREVIEW_URL = API + '/api/runtime-wiring/preview'

    function row(label, value, cls) {
      return `<div class="row"><span class="label">${label}</span><span class="${cls || 'val-ok'}">${value}</span></div>`
    }
    function flagRow(label, v) {
      return row(label, String(v), v === false ? 'val-ok' : 'val-bad')
    }

    function render(d) {
      const s = d.safety || {}
      document.getElementById('grid').innerHTML = `
        <div class="card">
          <div class="card-title" style="color:var(--proof)">&#128202; Source Registry</div>
          ${row('source_registry_entries', d.source_registry_entries ?? '—', 'val-proof')}
          ${row('families_sampled', d.families_sampled ?? '—', 'val-proof')}
          ${row('context_packets_count', d.context_packets_count ?? '—', 'val-proof')}
        </div>
        <div class="card">
          <div class="card-title" style="color:var(--green)">&#9654; Adapter Routing</div>
          ${row('status', d.status ?? '—', 'val-kernel')}
          ${row('dry_run', String(d.dry_run), d.dry_run ? 'val-ok' : 'val-bad')}
        </div>
        <div class="card">
          <div class="card-title" style="color:var(--kernel)">&#128737; X108 Dry-Run Decisions</div>
          ${row('context_only_decision', d.context_only_decision ?? '—',
                d.context_only_decision === 'ALLOW_CONTEXT_ONLY' ? 'val-ok' : 'val-bad')}
          ${row('critical_action_decision', d.critical_action_decision ?? '—',
                d.critical_action_decision === 'HOLD' ? 'val-warn' : 'val-bad')}
          ${row('decision_authority', d.decision_authority ?? '—', 'val-kernel')}
        </div>
        <div class="card">
          <div class="card-title" style="color:var(--block)">&#10060; Engine Bridge Preview</div>
          ${flagRow('runtime_active', d.runtime_active)}
          ${flagRow('emits_act', d.emits_act)}
          ${flagRow('proof_claim', d.proof_claim)}
        </div>
        <div class="card">
          <div class="card-title" style="color:var(--kernel)">&#128274; Safety Locks</div>
          ${flagRow('zip_extraction', s.zip_extraction)}
          ${flagRow('source_pack_import', s.source_pack_import)}
          ${flagRow('world_action', s.world_action)}
          ${flagRow('memory_write', s.memory_write)}
          ${flagRow('graph_write', s.graph_write)}
          ${flagRow('packages_created', s.packages_created)}
        </div>
      `
      document.getElementById('grid').style.display = 'grid'
      document.getElementById('ts').textContent = 'Last fetched: ' + new Date().toISOString()
    }

    async function load() {
      document.getElementById('err').style.display = 'none'
      try {
        const res = await fetch(PREVIEW_URL)
        if (!res.ok) throw new Error('HTTP ' + res.status)
        render(await res.json())
      } catch(e) {
        document.getElementById('err').style.display = 'block'
        document.getElementById('err').textContent = 'API unreachable: ' + e.message + ' (' + PREVIEW_URL + ')'
      }
    }

    load()
  </script>
</body>
</html>
