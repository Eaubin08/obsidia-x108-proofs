family: external_consequence_boundary
block: OBSIDIA_CONSEQUENCE_BOUNDARY_ENRICHMENT_V1
status: external category signal; not copied; not kernel authority
layer:
- OS2
- OS3
- OS4
role: Add RSSI-readable proof-surface, standing, continuation, consequence-binding
  and refusal vocabulary.
allowed:
- executable_standing_status
- continuation_legitimacy_status
- consequence_binding_status
- intent_effect_receipt_separation
- law_state_input_replay_triplet
- corridor_packaging
- visible_enforcement_surface
- protected_consequence
- wrapper_non_reauthoring_law
forbidden:
- redefine HOLD/BLOCK/ACT
- mutate KX108
- become decision authority
- self-authorize substrate law
- produce effect receipt without ACT
authority: KX108_ONLY
components:
